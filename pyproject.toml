[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erfaert"
version = "0.1.0"
description = "Er fært? An LLM agent that answers whether you can drive between places in Iceland, using live Vegagerðin road data"
readme = "README.md"
authors = [{ name = "Viðar Sigurðsson" }]
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE.md"]
requires-python = ">=3.10"
dependencies = [
    "pyproj>=3.4",
    "httpx>=0.25",
]

[project.optional-dependencies]
agent = ["anthropic>=2.0"]
dev = ["pytest>=7", "anthropic>=2.0"]

[project.scripts]
roadroute = "roadroute.cli:main"
erfaert = "erfaert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the real Vegagerðin geometry file (see README)",
]
